# Screen a project's dependencies on every pull request and push.
#
# Copy this file to .github/workflows/ in the project you want to protect.
# Change `path` if your dependency files are not at the repository root.
#
# The job fails when a dependency is blocked. Warnings do not fail the job;
# they are listed in the report artifact.
name: Dependency screening

permissions:
  contents: read

on:
  pull_request:
  push:
    branches: [main]

jobs:
  screen:
    runs-on: ubuntu-latest   # Docker is included on GitHub's Ubuntu runners
    steps:
      - uses: actions/checkout@v4

      - name: Screen dependencies
        uses: muhammadfaizan/supply-chain-sandbox@main   # pin to a tag or commit SHA in production
        with:
          path: "."
