# Dependency screening as a GitHub Actions step.
#
# Copy this file to .github/workflows/ in the project you want to protect.
# Set `app` below to the folder that holds your dependency files.
#
# The job fails when a dependency is blocked (scan exit code 1). Warnings do not
# fail the job; they appear in the saved report.
name: Dependency screening

on:
  pull_request:
  push:
    branches: [main]

jobs:
  screen:
    runs-on: ubuntu-latest      # needs Docker; GitHub's Ubuntu runners include it
    steps:
      - name: Check out your project
        uses: actions/checkout@v4
        with:
          path: app

      - name: Check out the screening tool
        uses: actions/checkout@v4
        with:
          repository: muhammadfaizan/supply-chain-sandbox
          # Pin to a tag or commit SHA so a future change can't alter your checks.
          ref: main
          path: sandbox

      - name: Screen dependencies
        working-directory: sandbox
        run: npm run scan -- ../app

      - name: Save the screening report
        if: always()            # keep the report even when the scan blocks
        uses: actions/upload-artifact@v4
        with:
          name: screening-report
          path: sandbox/reports/
