name: "Dependency supply-chain screen"
description: >
  Screens a folder's dependencies for known vulnerabilities, malware patterns, and
  install-time behavior. Fails the job when a dependency is blocked.
branding:
  icon: shield
  color: green

inputs:
  path:
    description: "Folder to screen, relative to the repository root."
    required: false
    default: "."
  ecosystem:
    description: "Only check these ecosystems: pypi, npm, rubygems, go (comma-separated). Empty = detect automatically."
    required: false
    default: ""
  local-tools:
    description: "Use OSV-Scanner and GuardDog installed on the runner instead of the Docker toolbox. true or false."
    required: false
    default: "false"
  reports-dir:
    description: "Folder where the screening reports are written."
    required: false
    default: "screening-reports"

runs:
  using: composite
  steps:
    - name: Screen dependencies
      shell: bash
      env:
        SCAN_PATH: ${{ inputs.path }}
        SCAN_ECOSYSTEM: ${{ inputs.ecosystem }}
        SCAN_LOCAL_TOOLS: ${{ inputs.local-tools }}
        SCAN_REPORTS: ${{ inputs.reports-dir }}
      run: |
        set -euo pipefail
        # The folder goes after "--" so a name starting with "-" is never read as an option.
        args=(--reports "$SCAN_REPORTS")
        if [ -n "$SCAN_ECOSYSTEM" ]; then
          args+=(--ecosystem "$SCAN_ECOSYSTEM")
        fi
        if [ "$SCAN_LOCAL_TOOLS" = "true" ]; then
          args+=(--local-tools)
        fi
        python3 "$GITHUB_ACTION_PATH/scripts/sandbox.py" scan "${args[@]}" -- "$SCAN_PATH"

    - name: Upload the screening reports
      if: always()
      uses: actions/upload-artifact@v4
      with:
        name: dependency-screening-reports
        path: ${{ inputs.reports-dir }}
        if-no-files-found: ignore
